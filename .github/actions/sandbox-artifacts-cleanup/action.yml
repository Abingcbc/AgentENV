name: Sandbox Artifacts Cleanup
description: Clean up sandbox artifacts generated by integration tests.

runs:
  using: composite
  steps:
    - name: Resolve sandbox paths
      id: resolve-sandbox-paths
      shell: bash
      run: |
        set -euo pipefail
        config_path="config/default.toml"
        config_dir="$(dirname "$config_path")"
        raw_home_path="$(sed -n 's/^home_path *= *"\(.*\)"/\1/p' "$config_path")"
        raw_deps_path="$(sed -n 's/^deps_path *= *"\(.*\)"/\1/p' "$config_path")"
        if [[ -z "$raw_home_path" ]]; then
          echo "home_path not found or empty in ${config_path}" >&2
          exit 1
        fi
        if [[ "$raw_home_path" = /* ]]; then
          home_path="$(realpath -m "$raw_home_path")"
        else
          home_path="$(realpath -m "${config_dir}/${raw_home_path}")"
        fi
        raw_deps_path="${raw_deps_path:-\$AENV_HOME/deps}"
        if [[ -n "${AENV_DEPS_PATH:-}" ]]; then
          deps_path="$(realpath -m "$AENV_DEPS_PATH")"
        else
          expanded_deps_path="${raw_deps_path//\$AENV_HOME/$home_path}"
          if [[ "$expanded_deps_path" = /* ]]; then
            deps_path="$(realpath -m "$expanded_deps_path")"
          else
            deps_path="$(realpath -m "${config_dir}/${expanded_deps_path}")"
          fi
        fi

        echo "home_path=${home_path}" >> "$GITHUB_OUTPUT"
        echo "deps_path=${deps_path}" >> "$GITHUB_OUTPUT"

    - name: Reset sandbox artifacts ownership
      shell: bash
      env:
        HOME_PATH: ${{ steps.resolve-sandbox-paths.outputs.home_path }}
        DEPS_PATH: ${{ steps.resolve-sandbox-paths.outputs.deps_path }}
      run: |
        set -u

        # The capability launcher uses sudo only to establish the non-root test
        # process. If a test aborts before normal shutdown, detached daemon or
        # Firecracker processes can still hold runtime and cache files open.
        sudo pkill -TERM -f 'uvm-ublk-daemon' || true
        sudo pkill -TERM -f 'firecracker' || true
        sleep 1
        sudo pkill -KILL -f 'uvm-ublk-daemon' || true
        sudo pkill -KILL -f 'firecracker' || true

        paths=(
          "$GITHUB_WORKSPACE"
          "$DEPS_PATH"
        )

        for path in "${paths[@]}"; do
          if [ -e "$path" ]; then
            sudo chmod -R u+rwX "$path" || true
            sudo chown -R "$(id -u):$(id -g)" "$path"
          fi
        done

        # Runtime state under the configured home path is volatile. Dependencies
        # are cached separately via AENV_DEPS_PATH, so remove the configured
        # runtime home only when it is clearly an AENV-owned directory.
        if [ -n "$HOME_PATH" ] && [ "$HOME_PATH" != "/" ] && [ -d "$HOME_PATH" ] && [ "$(basename "$HOME_PATH")" = "aenv" ]; then
          sudo rm -rf "$HOME_PATH"
        else
          echo "Skipping AENV runtime cleanup for missing or unsafe home path: ${HOME_PATH}" >&2
        fi
