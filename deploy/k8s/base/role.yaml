apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentenv-scheduler-discovery
rules:
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
